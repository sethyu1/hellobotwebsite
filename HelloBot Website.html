<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HelloBot · 招聘 AI 员工的官方网站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/system.css" />
<style>
  html, body { background: var(--bg-1); }
  /* design canvas presentation */
  .canvas-stage { min-height: 100vh; background: var(--bg-0); }
  /* mobile drawer animations */
  @keyframes hb-fade-in { from { opacity: 0 } to { opacity: 1 } }
  @keyframes hb-slide-in { from { transform: translateX(100%) } to { transform: translateX(0) } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="js/content.js?v=5"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="js/components.jsx?v=5"></script>
<script type="text/babel" src="js/home.jsx?v=4"></script>
<script type="text/babel" src="js/diary.jsx?v=4"></script>
<script type="text/babel" src="js/product-sections.jsx?v=1"></script>
<script type="text/babel" src="js/pages.jsx?v=4"></script>
<script type="text/babel" src="js/cases-page.jsx?v=1"></script>
<script type="text/babel" src="js/pricing-page.jsx?v=1"></script>
<script type="text/babel" src="js/about.jsx?v=1"></script>
<script type="text/babel" src="js/secretary-spotlight.jsx?v=1"></script>
<script type="text/babel" src="js/app.jsx?v=4"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "mode": "canvas",
  "language": "zh",
  "page": "home"
}/*EDITMODE-END*/;

function CanvasView() {
  const [tw, setTw] = useTweaks(TWEAK_DEFAULTS);
  const lang = tw.language;
  const page = tw.page;

  // Page list
  const pageOptions = [
    { v: "home",      zhL: "首页",      enL: "Home" },
    { v: "employees", zhL: "AI员工",    enL: "Employees" },
    { v: "product",   zhL: "产品",      enL: "Product" },
    { v: "cases",     zhL: "使用场景",  enL: "Use Cases" },
    { v: "pricing",   zhL: "定价",      enL: "Pricing" },
    { v: "faq",       zhL: "FAQ",       enL: "FAQ" },
    { v: "about",     zhL: "关于我们",  enL: "About" },
  ];

  return (
    <>
      <DesignCanvas projectName="HelloBot · 官网重新设计 / Website Redesign" initialZoom={0.55}>
        <DCSection id="desktop" title="🖥️  桌面端 / Desktop · 1440px">
          {pageOptions.map(p => (
            <DCArtboard key={"d-"+p.v} id={"d-"+p.v} label={(lang==="zh"?p.zhL:p.enL)+" — Desktop"} width={1440} height={2400}>
              <App initialPage={p.v} initialLang={lang} mobile={false} />
            </DCArtboard>
          ))}
        </DCSection>

        <DCSection id="mobile" title="📱  移动端 / Mobile · 390px (iPhone)">
          {pageOptions.map(p => (
            <DCArtboard key={"m-"+p.v} id={"m-"+p.v} label={(lang==="zh"?p.zhL:p.enL)+" — Mobile"} width={390} height={2200}>
              <App initialPage={p.v} initialLang={lang} mobile={true} />
            </DCArtboard>
          ))}
        </DCSection>

        <DCSection id="tokens" title="🎨  Design Tokens · 设计系统">
          <DCArtboard id="tokens-1" label="Color & Type & Components" width={1240} height={780}>
            <TokensSheet lang={lang} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks" defaultPosition={{ right: 24, bottom: 24 }}>
        <TweakSection title={lang==="zh"?"语言":"Language"}>
          <TweakRadio
            label={lang==="zh"?"网站语言":"Site language"}
            value={tw.language}
            options={[{value:"zh",label:"中文"},{value:"en",label:"EN"}]}
            onChange={v => setTw("language", v)}
          />
        </TweakSection>
        <TweakSection title={lang==="zh"?"视图模式":"View Mode"}>
          <TweakRadio
            label={lang==="zh"?"显示":"Show"}
            value={tw.mode}
            options={[
              {value:"canvas",label:lang==="zh"?"全部画板":"All artboards"},
              {value:"single",label:lang==="zh"?"单页全屏":"Single page"},
            ]}
            onChange={v => setTw("mode", v)}
          />
          {tw.mode === "single" && (
            <TweakSelect
              label={lang==="zh"?"页面":"Page"}
              value={tw.page}
              options={pageOptions.map(p => ({ value: p.v, label: lang==="zh"?p.zhL:p.enL }))}
              onChange={v => setTw("page", v)}
            />
          )}
        </TweakSection>
        <TweakSection title={lang==="zh"?"提示":"Tips"}>
          <div style={{ fontSize: 12, color: "rgba(255,255,255,.55)", lineHeight: 1.6 }}>
            {lang==="zh"
              ? "在画板模式下，可拖拽、双击放大某张设计稿。点击导航或左侧箭头可在原型内跳转页面。"
              : "In canvas mode you can drag and double-click to zoom. Use the in-prototype nav to jump pages."}
          </div>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

function SingleView() {
  const [tw, setTw] = useTweaks(TWEAK_DEFAULTS);
  const pageOptions = [
    { v: "home",      zhL: "首页",      enL: "Home" },
    { v: "employees", zhL: "AI员工",    enL: "Employees" },
    { v: "product",   zhL: "产品",      enL: "Product" },
    { v: "cases",     zhL: "使用场景",  enL: "Use Cases" },
    { v: "pricing",   zhL: "定价",      enL: "Pricing" },
    { v: "faq",       zhL: "FAQ",       enL: "FAQ" },
    { v: "about",     zhL: "关于我们",  enL: "About" },
  ];
  return (
    <>
      <App initialPage={tw.page} initialLang={tw.language} mobile={false} />
      <TweaksPanel title="Tweaks" defaultPosition={{ right: 24, bottom: 24 }}>
        <TweakSection title="Mode">
          <TweakRadio label="View" value={tw.mode}
            options={[{value:"canvas",label:"All artboards"},{value:"single",label:"Single page"}]}
            onChange={v => setTw("mode", v)} />
        </TweakSection>
        <TweakSection title="Language">
          <TweakRadio label="Lang" value={tw.language}
            options={[{value:"zh",label:"中文"},{value:"en",label:"EN"}]}
            onChange={v => setTw("language", v)} />
        </TweakSection>
        <TweakSection title="Page">
          <TweakSelect label="Page" value={tw.page}
            options={pageOptions.map(p => ({ value: p.v, label: tw.language==="zh"?p.zhL:p.enL }))}
            onChange={v => setTw("page", v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

function TokensSheet({ lang }) {
  const colors = [
    ["bg-1", "#0B1020"], ["bg-2", "#131A2A"], ["bg-3", "#1A2236"], ["bg-paper", "#F5EFE3"],
    ["brand", "#FF8A3D"], ["ok", "#3BCB7A"], ["warn", "#F2C94C"], ["bad", "#FF5C5C"],
    ["info", "#4DA3FF"], ["plum", "#B58CFF"], ["ink-0", "#F5F7FB"], ["ink-2", "#A8B0C3"],
  ];
  return (
    <div style={{ padding: 36, color: "var(--ink-0)", background: "var(--bg-1)", minHeight: "100%" }}>
      <div className="t-eyebrow">DESIGN SYSTEM</div>
      <h2 className="h-section" style={{ marginTop: 12 }}>{lang==="zh"?"色彩 · 字体 · 组件":"Color · Type · Components"}</h2>

      <div style={{ marginTop: 32, display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 12 }}>
        {colors.map(([n, hex]) => (
          <div key={n} style={{ background: "var(--bg-2)", border: "1px solid var(--line)", borderRadius: 12, padding: 12 }}>
            <div style={{ height: 64, borderRadius: 8, background: hex, border: "1px solid rgba(255,255,255,.05)" }} />
            <div style={{ marginTop: 8, fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-1)" }}>--{n}</div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 10, color: "var(--ink-3)" }}>{hex}</div>
          </div>
        ))}
      </div>

      <div style={{ marginTop: 36, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
        <div className="card-dark" style={{ padding: 24 }}>
          <div className="t-eyebrow">TYPE</div>
          <div className="h-display" style={{ marginTop: 14 }}>当老板。</div>
          <div className="h-section" style={{ marginTop: 8 }}>You're being the boss.</div>
          <div style={{ marginTop: 12, color: "var(--ink-1)", fontSize: 16 }}>Body — 像招聘一样雇佣 AI 员工。</div>
          <div className="t-mono" style={{ marginTop: 12, color: "var(--ink-3)", fontSize: 12 }}>// JetBrains Mono — paperwork voice</div>
        </div>
        <div className="card-dark" style={{ padding: 24 }}>
          <div className="t-eyebrow">COMPONENTS</div>
          <div style={{ marginTop: 16, display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button className="btn btn-primary btn-sm">Primary</button>
            <button className="btn btn-ghost btn-sm">Ghost</button>
            <button className="btn btn-paper btn-sm">Paper</button>
          </div>
          <div style={{ marginTop: 14, display: "flex", gap: 8, flexWrap: "wrap" }}>
            <Stamp color="orange">HIRED</Stamp>
            <Stamp color="green">ON DUTY</Stamp>
            <Stamp color="red">CLOCKING OUT</Stamp>
            <Stamp color="purple">TRIAL</Stamp>
          </div>
          <div style={{ marginTop: 18 }}><EnergyBar value={72} /></div>
        </div>
      </div>
    </div>
  );
}

function Root() {
  const [tw] = useTweaks(TWEAK_DEFAULTS);
  return tw.mode === "single" ? <SingleView /> : <CanvasView />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
